# The operator's rule: "We can't use float." Every pull request's code is scanned for binary floating point, and anything found outside scripts/FLOAT-EVIDENCE.txt fails. Integer only, json=0.
name: No floating point

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  no-float:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: The gate reads its own test snippets
        run: python3 -I -X utf8 scripts/no_float_gate.py --selftest
      - name: Scan all tracked code
        run: python3 -I -X utf8 scripts/no_float_gate.py .
      - name: The gate goes red on planted floats
        run: |
          set -euo pipefail
          for plant in 'x = 1 / 2|planted_float.py' 'import time; x = time.time()|planted_clock.py' 'fn f() -> u8 { let a = 0.5; 1 }|planted_float.rs'; do
            file="scripts/${plant##*|}"
            printf '%s\n' "${plant%|*}" > "$file"
            git add "$file"
            if python3 -I -X utf8 scripts/no_float_gate.py . > /tmp/planted.out; then echo "the gate passed $file"; exit 1; fi
            grep -q "file=$file" /tmp/planted.out
            git rm -q -f --cached "$file"
            rm -f "$file"
          done
