# Exact-head replay of the result packages (results/*-cloud/ and native/ym/results/*-cloud/).
# First the toolchain manifest: every file of the HEB-C toolchain copy under native/ must match
# native/TOOLCHAIN.SHA256 (a toolchain change has to update the manifest in the same pull request).
# Then, for every package present: verify SHA256SUMS and the HASH seal, then run its run.sh, which checks
# the prediction seals, rebuilds with Rust 1.81, runs clippy -D warnings, runs every HTTP-0 job through
# `hebc_ym_http0 serve` where the package uses it, and checks the output is byte-identical to the recorded
# HBP. Fail-closed: any missing file, failed sum, seal mismatch, build failure, timeout or byte difference
# fails the job. Integer only, json=0.
name: SU(N) result replay (Rust 1.81)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'results/*-cloud/**'
      - 'native/**'
      - '.github/workflows/results-replay.yml'

permissions:
  contents: read

jobs:
  replay:
    name: Replay result packages on the exact head
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Rust 1.81 with clippy
        run: rustup toolchain install 1.81.0 --profile minimal -c clippy
      - name: Toolchain manifest
        run: |
          set -euo pipefail
          cd native
          sha256sum -c --quiet TOOLCHAIN.SHA256
          listed=$(cut -c67- TOOLCHAIN.SHA256 | LC_ALL=C sort)
          present=$(find . -type f ! -path './ym/results/*' ! -path './target/*' ! -path './ym/target/*' ! -name TOOLCHAIN.SHA256 | sed 's|^\./||' | LC_ALL=C sort)
          [ "$listed" = "$present" ] || { echo "TOOLCHAIN|result=FAIL|reason=unlisted_or_missing_files|json=0"; diff <(echo "$listed") <(echo "$present"); exit 1; }
          echo "TOOLCHAIN|result=PASS|files=$(wc -l < TOOLCHAIN.SHA256)|json=0"
      - name: Verify chains and replay
        run: |
          set +e
          set -uo pipefail
          o=CLOUD-REPLAY.hbp; : > $o; bad=0; n=0
          echo "CLOUD_REPLAY|run=$GITHUB_RUN_ID|commit=$GITHUB_SHA|json=0" >> $o
          for d in results/*-cloud native/ym/results/*-cloud; do
            [ -f "$d/run.sh" ] || continue
            n=$((n+1))
            seal=$(ls $d/*.seal 2>/dev/null | head -1); hbi=$(ls $d/*.hbi 2>/dev/null | head -1)
            sums=0; (cd $d && sha256sum -c --quiet SHA256SUMS) && sums=1
            sealok=0
            if [ -n "$seal" ] && [ -n "$hbi" ]; then
              [ "$(cat $d/SHA256SUMS $hbi | sha256sum | cut -c1-64)" = "$(cat $seal)" ] && sealok=1
            fi
            bash $d/run.sh > rep.txt 2>&1; rc=$?
            grep -E '^REPLAY\|' rep.txt | sed "s#^#PKG|dir=$d|#" >> $o
            ok=0; [ $sums = 1 ] && [ $sealok = 1 ] && [ $rc = 0 ] && ok=1; [ $ok = 1 ] || { bad=1; cat rep.txt; }
            echo "PACKAGE|dir=$d|sha256sums=$sums|seal=$sealok|replay_exit=$rc|ok=$ok|json=0" >> $o
          done
          [ $n -gt 0 ] || bad=1
          echo "CLOUD_REPLAY_RESULT|packages=$n|all_ok=$([ $bad = 0 ] && echo 1 || echo 0)|json=0" >> $o
          cat $o
          [ $bad = 0 ]
